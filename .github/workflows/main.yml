name: Construire IrwaneTraceForest.exe

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install reportlab pyinstaller

    - name: Compiler avec PyInstaller
      run: |
        pyinstaller itf.spec --clean --noconfirm

    - name: Sauvegarder l'exécutable
      uses: actions/upload-artifact@v4
      with:
        name: IrwaneTraceForest
        path: dist/IrwaneTraceForest.exe
